<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#1a1f2e"/>

  <!-- Bar chart bars (ascending left to right) -->
  <rect x="72"  y="340" width="64" height="100" rx="8" fill="#3b82f6" opacity="0.7"/>
  <rect x="160" y="290" width="64" height="150" rx="8" fill="#3b82f6" opacity="0.8"/>
  <rect x="248" y="230" width="64" height="210" rx="8" fill="#3b82f6" opacity="0.9"/>
  <rect x="336" y="160" width="64" height="280" rx="8" fill="#3b82f6"/>

  <!-- Upward trend line over bars -->
  <polyline
    points="104,320 192,268 280,208 368,138"
    fill="none"
    stroke="#22c55e"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrow head on trend line -->
  <polygon
    points="368,138 340,120 388,108"
    fill="#22c55e"
  />

  <!-- Baseline -->
  <rect x="56" y="450" width="400" height="10" rx="5" fill="#334155"/>
</svg>
